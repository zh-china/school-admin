<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学校学生管理系统</title>
    <style>
      /* ── 全局科技感变量 ── */
      :root {
        --tech-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --tech-blue: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --tech-green: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        --tech-orange: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        --tech-purple: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        --card-radius: 16px;
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        --card-hover-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-family);
        background: #f0f2f5;
        -webkit-font-smoothing: antialiased;
      }
      /* 全局卡片科技感 */
      .el-card {
        border-radius: var(--card-radius) !important;
        border: 1px solid rgba(102, 126, 234, 0.08) !important;
        box-shadow: var(--card-shadow) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        overflow: hidden;
      }
      .el-card:hover {
        box-shadow: var(--card-hover-shadow) !important;
        border-color: rgba(102, 126, 234, 0.18) !important;
      }
      .el-card__header {
        border-bottom: 1px solid rgba(0, 0, 0, 0.04) !important;
        font-weight: 600;
        font-size: 15px;
        color: #1a1a2e;
      }
      /* 按钮科技感 */
      .el-button--primary {
        background: var(--tech-gradient) !important;
        border: none !important;
        transition: all 0.3s ease !important;
      }
      .el-button--primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
      }
      /* 表格 */
      .el-table {
        border-radius: 12px;
        overflow: hidden;
      }
      .el-table th.el-table__cell {
        background: linear-gradient(180deg, #f8f9ff 0%, #f0f2ff 100%);
        color: #4a5568;
        font-weight: 600;
      }
      .el-table .cell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        word-break: keep-all;
      }
      /* 分页圆角 */
      .el-pagination .el-pager li {
        border-radius: 8px !important;
      }
      /* 弹窗 */
      .el-dialog {
        border-radius: 20px !important;
        overflow: hidden;
      }
      .el-dialog__header {
        background: linear-gradient(135deg, #f8f9ff 0%, #ede9fe 100%);
        border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        padding: 20px 24px;
      }
      .el-dialog__title {
        font-weight: 700;
        color: #1a1a2e;
      }
      /* 输入框 */
      .el-input__wrapper {
        border-radius: 10px !important;
        transition: all 0.3s ease !important;
      }
      .el-input__wrapper:hover {
        box-shadow: 0 0 0 1px rgba(102, 126, 234, 0.3) inset !important;
      }
      /* select */
      .el-select .el-input__wrapper {
        border-radius: 10px !important;
      }
      /* tag */
      .el-tag {
        border-radius: 8px !important;
      }
      /* 搜索卡片 */
      .search-card {
        background: white;
      }
      .card-header {
        display: flex; align-items: center; justify-content: space-between;
      }
      .page {
        animation: fadeInUp 0.4s ease;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
